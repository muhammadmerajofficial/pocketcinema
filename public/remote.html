<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Remote Control - Cinematic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html5-qrcode CDN -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#08080c] text-zinc-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header -->
  <header class="p-4 border-b border-zinc-800/80 bg-[#0c0d12]/90 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl">📡</span>
      <div>
        <h1 class="text-sm font-black tracking-wider uppercase text-white">TV REMOTE CONTROL</h1>
        <p class="text-[11px] text-zinc-400">Firebase Realtime Room Sync</p>
      </div>
    </div>
    <a href="/" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-zinc-900 border border-zinc-800 text-amber-400 hover:text-white">
      Catalog 🎬
    </a>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">

    <!-- CONNECT SECTION (Shown when not connected) -->
    <div id="connect-section" class="rounded-3xl bg-zinc-900/90 border border-zinc-800 p-6 flex flex-col gap-4">
      <div class="text-center">
        <h2 class="text-base font-bold text-white">Pair with TV Screen</h2>
        <p class="text-xs text-zinc-400 mt-1">Scan the QR code on your TV or type the 4-digit code</p>
      </div>

      <!-- QR Scanner Camera Area -->
      <div class="relative w-full rounded-2xl overflow-hidden bg-black border border-zinc-800 aspect-square flex items-center justify-center">
        <div id="qr-reader" class="w-full h-full"></div>
      </div>

      <div class="flex items-center gap-2">
        <button id="toggle-camera-btn" onclick="toggleCameraScanner()" class="flex-1 py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs flex items-center justify-center gap-2 cursor-pointer shadow-md">
          📷 Start Camera Scanner
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-1">
        <div class="flex-1 h-[1px] bg-zinc-800"></div>
        <span class="text-xs text-zinc-500 uppercase font-mono">OR</span>
        <div class="flex-1 h-[1px] bg-zinc-800"></div>
      </div>

      <!-- Manual 4-Digit Code Entry -->
      <form onsubmit="handleManualConnect(event)" class="flex flex-col gap-2.5">
        <label class="text-xs text-zinc-400 font-medium">Enter 4-Digit TV Code:</label>
        <div class="flex gap-2">
          <input 
            id="room-code-input" 
            type="text" 
            maxlength="4" 
            placeholder="e.g. 4829" 
            class="flex-1 text-center font-mono text-xl font-black py-2 px-3 bg-black/80 border border-zinc-700 rounded-xl text-amber-400 focus:outline-none focus:border-amber-400 tracking-widest"
          />
          <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs cursor-pointer active:scale-95">
            Connect
          </button>
        </div>
        <div id="connect-error" class="hidden text-xs text-red-400 mt-1"></div>
      </form>
    </div>

    <!-- CONTROL PANEL (Shown after successful connection) -->
    <div id="control-panel" class="hidden flex flex-col gap-4">
      <!-- Status Card -->
      <div class="rounded-2xl bg-zinc-900 border border-amber-500/30 p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <div>
            <div class="text-xs font-semibold text-emerald-400">TV Connected</div>
            <div class="text-base font-mono font-bold text-amber-400 tracking-wider">
              Room #<span id="active-room-display">----</span>
            </div>
          </div>
        </div>
        <button onclick="disconnectRemote()" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-semibold text-zinc-400 hover:text-white cursor-pointer">
          Disconnect
        </button>
      </div>

      <!-- Now Streaming Info -->
      <div class="rounded-2xl bg-black/60 border border-zinc-800 p-4 text-center">
        <span class="text-xs text-zinc-500 uppercase tracking-wider font-semibold">Active Playback</span>
        <h3 id="current-title-display" class="text-sm font-bold text-white mt-1">
          No movie currently selected
        </h3>
      </div>

      <!-- Main Playback Controls: Rewind, Play/Pause, Fast Forward -->
      <div class="grid grid-cols-3 gap-3">
        <button onclick="sendAction('rewind')" class="py-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 font-bold text-sm flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
          <span class="text-lg">⏪</span>
          <span class="text-[11px] text-zinc-300">10s Rewind</span>
        </button>

        <button id="play-pause-btn" onclick="togglePlayPause()" class="py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer shadow-lg shadow-amber-500/20">
          <span id="play-pause-icon" class="text-2xl">▶️</span>
          <span id="play-pause-text" class="text-xs font-black">Play</span>
        </button>

        <button onclick="sendAction('forward')" class="py-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-amber-400 font-bold text-sm flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer">
          <span class="text-lg">⏩</span>
          <span class="text-[11px] text-zinc-300">10s Forward</span>
        </button>
      </div>

      <!-- Volume Slider Control -->
      <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-4 flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs text-zinc-400">
          <span>🔊 TV Volume</span>
          <span id="volume-label" class="font-mono text-amber-400 font-bold">100%</span>
        </div>
        <input 
          id="volume-slider" 
          type="range" 
          min="0" 
          max="100" 
          value="100" 
          oninput="handleVolumeChange(this.value)" 
          class="w-full accent-amber-500 cursor-pointer"
        />
      </div>

      <!-- Close Player Session Button -->
      <button onclick="closePlayerSession()" class="py-3.5 px-4 rounded-2xl bg-red-950/40 hover:bg-red-900/60 border border-red-500/40 text-red-300 hover:text-white font-bold text-xs flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95 shadow-md">
        <span>❌ Close Player Session</span>
      </button>

      <!-- Return to Catalog Button -->
      <a href="/" class="py-3 px-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-xs text-center font-semibold">
        ← Browse Movies &amp; TV Series
      </a>
    </div>

  </main>

  <script>
    // 1. Firebase Config
    const firebaseConfig = {
      projectId: "gen-lang-client-0893712868",
      appId: "1:583358101087:web:f3967a19056fbcf5c30dea",
      apiKey: "AIzaSyA43x9EPKBy8TORPnmYq4lYLjDFgcC4I-I",
      authDomain: "gen-lang-client-0893712868.firebaseapp.com",
      storageBucket: "gen-lang-client-0893712868.firebasestorage.app",
      messagingSenderId: "583358101087"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let activeRoomCode = null;
    let isPlaying = false;
    let html5QrScanner = null;
    let cameraRunning = false;

    // 2. Read room from URL query (e.g., from QR scan)
    const urlParams = new URLSearchParams(window.location.search);
    const initialRoom = urlParams.get('room') || urlParams.get('code');
    if (initialRoom && initialRoom.trim().length === 4) {
      connectToRoom(initialRoom.trim());
    }

    async function connectToRoom(code) {
      const errorDiv = document.getElementById('connect-error');
      errorDiv.classList.add('hidden');

      try {
        const docRef = db.collection('rooms').doc(code);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
          errorDiv.textContent = 'Room #' + code + ' not found. Please check your TV screen.';
          errorDiv.classList.remove('hidden');
          return;
        }

        activeRoomCode = code;
        await docRef.update({
          status: 'connected',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Switch to Control Panel UI
        document.getElementById('connect-section').classList.add('hidden');
        document.getElementById('control-panel').classList.remove('hidden');
        document.getElementById('active-room-display').textContent = code;

        // Stop camera if running
        if (cameraRunning) {
          toggleCameraScanner();
        }

        // Listen to room updates
        listenToActiveRoom(code);
      } catch (err) {
        errorDiv.textContent = 'Connection error: ' + err.message;
        errorDiv.classList.remove('hidden');
      }
    }

    function handleManualConnect(e) {
      e.preventDefault();
      const code = document.getElementById('room-code-input').value.trim();
      if (code.length === 4) {
        connectToRoom(code);
      }
    }

    function listenToActiveRoom(code) {
      db.collection('rooms').doc(code).onSnapshot((doc) => {
        if (!doc.exists) return;
        const data = doc.data();

        if (data.status === 'closed') {
          disconnectRemote();
          return;
        }

        isPlaying = !!data.isPlaying;
        updatePlayPauseUI(isPlaying);

        if (data.playingItem && data.playingItem.title) {
          document.getElementById('current-title-display').textContent = data.playingItem.title;
        } else {
          document.getElementById('current-title-display').textContent = 'No movie currently selected';
        }

        if (typeof data.volume === 'number') {
          document.getElementById('volume-slider').value = data.volume;
          document.getElementById('volume-label').textContent = data.volume + '%';
        }
      });
    }

    function updatePlayPauseUI(playing) {
      const icon = document.getElementById('play-pause-icon');
      const text = document.getElementById('play-pause-text');
      const btn = document.getElementById('play-pause-btn');

      if (playing) {
        icon.textContent = '⏸️';
        text.textContent = 'Pause';
        btn.className = 'py-4 rounded-2xl bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-sm flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer shadow-lg shadow-amber-500/20';
      } else {
        icon.textContent = '▶️';
        text.textContent = 'Play';
        btn.className = 'py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold text-sm flex flex-col items-center justify-center gap-1 active:scale-95 cursor-pointer shadow-lg shadow-emerald-500/20';
      }
    }

    function sendAction(action) {
      if (!activeRoomCode) return;
      db.collection('rooms').doc(activeRoomCode).update({
        action: action,
        lastCommandTimestamp: Date.now()
      });
    }

    function togglePlayPause() {
      if (!activeRoomCode) return;
      const nextPlaying = !isPlaying;
      isPlaying = nextPlaying;
      updatePlayPauseUI(nextPlaying);

      db.collection('rooms').doc(activeRoomCode).update({
        isPlaying: nextPlaying,
        action: nextPlaying ? 'play' : 'pause',
        lastCommandTimestamp: Date.now()
      });
    }

    function handleVolumeChange(val) {
      document.getElementById('volume-label').textContent = val + '%';
      if (!activeRoomCode) return;
      db.collection('rooms').doc(activeRoomCode).update({
        volume: Number(val),
        lastCommandTimestamp: Date.now()
      });
    }

    function closePlayerSession() {
      if (!activeRoomCode) return;
      db.collection('rooms').doc(activeRoomCode).update({
        action: 'close',
        isPlaying: false,
        playingItem: null,
        lastCommandTimestamp: Date.now()
      });
    }

    function disconnectRemote() {
      if (activeRoomCode) {
        db.collection('rooms').doc(activeRoomCode).update({
          status: 'waiting'
        }).catch(() => {});
      }
      activeRoomCode = null;
      document.getElementById('control-panel').classList.add('hidden');
      document.getElementById('connect-section').classList.remove('hidden');
    }

    function toggleCameraScanner() {
      const btn = document.getElementById('toggle-camera-btn');
      if (!cameraRunning) {
        html5QrScanner = new Html5Qrcode("qr-reader");
        html5QrScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 200 },
          (decodedText) => {
            const match = decodedText.match(/[?&]room=([0-9a-zA-Z]{4})/i) || decodedText.match(/[?&]code=([0-9a-zA-Z]{4})/i);
            const code = match ? match[1] : (/^\d{4}$/.test(decodedText.trim()) ? decodedText.trim() : null);
            if (code) {
              connectToRoom(code);
            }
          },
          () => {}
        ).then(() => {
          cameraRunning = true;
          btn.textContent = '⏹ Stop Camera';
        }).catch((err) => {
          alert('Camera error: ' + err);
        });
      } else {
        html5QrScanner.stop().then(() => {
          cameraRunning = false;
          btn.textContent = '📷 Start Camera Scanner';
        });
      }
    }
  </script>
</body>
</html>
